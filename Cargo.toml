[workspace]
resolver = "2"
members = ["core", "core/bindings"]
exclude = ["probes/tauri/src-tauri"]

[workspace.dependencies]
# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time and date handling
# M1 uses chrono for core timestamp and datetime handling, compatible with rusqlite.
# I02 uses chrono-tz for proper timezone/DST handling with LocalResult support.
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
