[package]
name = "ohand-tauri-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", features = ["shell-open", "os-all"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
