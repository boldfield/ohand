name: OhAnd
options:
  bundleIdPrefix: com.boldfield.ohand
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

settings:
  PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.app
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  SWIFT_VERSION: "5.9"
  CODE_SIGN_IDENTITY: iPhone Developer
  CODE_SIGNING_REQUIRED: "NO"
  AD_HOC_CODE_SIGNING_ALLOWED: "YES"

targets:
  OhAndServices:
    type: framework
    platform: iOS
    sources:
      - path: Services
        createIntermediateGroups: true
        optional: true
    settings:
      PRODUCT_NAME: OhAndServices
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.services

  OhAndApp:
    type: application
    platform: iOS
    sources:
      - path: AppAssembly
        createIntermediateGroups: true
      - path: OhAndCoreBridge
        createIntermediateGroups: true
      - path: Capture
        createIntermediateGroups: true
        optional: true
    settings:
      PRODUCT_NAME: OhAnd
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.app
      INFOPLIST_FILE: AppAssembly/Info.plist
    dependencies:
      - target: OhAndServices

  OhAndControl:
    type: application
    platform: iOS
    sources:
      - path: AppAssembly
        createIntermediateGroups: true
      - path: OhAndCoreBridge
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: OhAndControl
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.control
      INFOPLIST_FILE: AppAssembly/Info.plist
      GCC_PREPROCESSOR_DEFINITIONS: OHAND_BUILD_TARGET_CONTROL=1
    dependencies:
      - target: OhAndServices

  OhAndTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        createIntermediateGroups: true
        optional: true
    settings:
      PRODUCT_NAME: OhAndTests
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.tests
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/OhAnd.app/OhAnd
      BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: OhAndApp

  BridgeProbe:
    type: application
    platform: iOS
    sources:
      - path: BridgeProbe
        createIntermediateGroups: true
        excludes:
          - Info.plist
    settings:
      PRODUCT_NAME: BridgeProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.bridge
      INFOPLIST_FILE: BridgeProbe/Info.plist
    dependencies:
      - target: OhAndServices

  NotificationProbe:
    type: application
    platform: iOS
    sources:
      - path: NotificationProbe
        createIntermediateGroups: true
        excludes:
          - Info.plist
    settings:
      PRODUCT_NAME: NotificationProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.notification
      INFOPLIST_FILE: NotificationProbe/Info.plist

  AudioProbe:
    type: application
    platform: iOS
    sources:
      - path: AudioProbe
        createIntermediateGroups: true
        excludes:
          - Info.plist
    settings:
      PRODUCT_NAME: AudioProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.audio
      INFOPLIST_FILE: AudioProbe/Info.plist

  TranscriptionProbe:
    type: application
    platform: iOS
    sources:
      - path: TranscriptionProbe
        createIntermediateGroups: true
        excludes:
          - Info.plist
    settings:
      PRODUCT_NAME: TranscriptionProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.transcription
      INFOPLIST_FILE: TranscriptionProbe/Info.plist

  CredentialProbe:
    type: application
    platform: iOS
    sources:
      - path: CredentialProbe
        createIntermediateGroups: true
        excludes:
          - Info.plist
    settings:
      PRODUCT_NAME: CredentialProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.credential
      INFOPLIST_FILE: CredentialProbe/Info.plist

  CaptureProbe:
    type: application
    platform: iOS
    sources:
      - path: CaptureProbe
        createIntermediateGroups: true
        excludes:
          - Info.plist
    settings:
      PRODUCT_NAME: CaptureProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.capture
      INFOPLIST_FILE: CaptureProbe/Info.plist

schemes:
  OhAndApp:
    build:
      targets:
        OhAndApp: all
  OhAndControl:
    build:
      targets:
        OhAndControl: all
  OhAndTests:
    build:
      targets:
        OhAndTests: all
    test:
      targets:
        - OhAndTests
  BridgeProbe:
    build:
      targets:
        BridgeProbe: all
  NotificationProbe:
    build:
      targets:
        NotificationProbe: all
  AudioProbe:
    build:
      targets:
        AudioProbe: all
  TranscriptionProbe:
    build:
      targets:
        TranscriptionProbe: all
  CredentialProbe:
    build:
      targets:
        CredentialProbe: all
  CaptureProbe:
    build:
      targets:
        CaptureProbe: all
