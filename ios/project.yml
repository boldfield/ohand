name: OhAnd
options:
  bundleIdPrefix: com.boldfield.ohand
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

settings:
  PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.app
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  SWIFT_VERSION: "5.9"
  CODE_SIGN_IDENTITY: iPhone Developer
  CODE_SIGNING_REQUIRED: "NO"
  AD_HOC_CODE_SIGNING_ALLOWED: "YES"

targets:
  OhAndApp:
    type: application
    platform: iOS
    sources:
      - path: AppAssembly
        createIntermediateGroups: true
      - path: OhAndCoreBridge
        createIntermediateGroups: true
      - path: Services
        createIntermediateGroups: true
        optional: true
      - path: Capture
        createIntermediateGroups: true
        optional: true
    settings:
      PRODUCT_NAME: OhAnd
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.app
      INFOPLIST_FILE: AppAssembly/Info.plist
    dependencies:
      - target: OhAndServices

  OhAndServices:
    type: framework
    platform: iOS
    sources:
      - path: Services
        createIntermediateGroups: true
        optional: true
    settings:
      PRODUCT_NAME: OhAndServices
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.services

  OhAndControl:
    type: application
    platform: iOS
    sources:
      - path: AppAssembly
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: OhAndControl
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.control
      INFOPLIST_FILE: AppAssembly/Info.plist

  OhAndTests:
    type: bundle
    platform: iOS
    sources:
      - path: Tests
        createIntermediateGroups: true
        optional: true
    settings:
      PRODUCT_NAME: OhAndTests
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.tests
      TEST_TARGET_NAME: OhAndApp
    dependencies:
      - target: OhAndApp

  BridgeProbe:
    type: application
    platform: iOS
    sources:
      - path: BridgeProbe/Sources
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: BridgeProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.bridge
      INFOPLIST_FILE: BridgeProbe/Sources/Info.plist
    dependencies:
      - target: OhAndServices

  NotificationProbe:
    type: application
    platform: iOS
    sources:
      - path: NotificationProbe/Sources
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: NotificationProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.notification
      INFOPLIST_FILE: NotificationProbe/Sources/Info.plist

  AudioProbe:
    type: application
    platform: iOS
    sources:
      - path: AudioProbe/Sources
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: AudioProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.audio
      INFOPLIST_FILE: AudioProbe/Sources/Info.plist

  TranscriptionProbe:
    type: application
    platform: iOS
    sources:
      - path: TranscriptionProbe/Sources
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: TranscriptionProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.transcription
      INFOPLIST_FILE: TranscriptionProbe/Sources/Info.plist

  CredentialProbe:
    type: application
    platform: iOS
    sources:
      - path: CredentialProbe/Sources
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: CredentialProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.credential
      INFOPLIST_FILE: CredentialProbe/Sources/Info.plist

  CaptureProbe:
    type: application
    platform: iOS
    sources:
      - path: CaptureProbe/Sources
        createIntermediateGroups: true
    settings:
      PRODUCT_NAME: CaptureProbe
      PRODUCT_BUNDLE_IDENTIFIER: com.boldfield.ohand.probes.capture
      INFOPLIST_FILE: CaptureProbe/Sources/Info.plist

schemes:
  OhAndApp:
    build:
      targets:
        OhAndApp: all
  OhAndControl:
    build:
      targets:
        OhAndControl: all
  OhAndTests:
    build:
      targets:
        OhAndTests: all
  BridgeProbe:
    build:
      targets:
        BridgeProbe: all
  NotificationProbe:
    build:
      targets:
        NotificationProbe: all
  AudioProbe:
    build:
      targets:
        AudioProbe: all
  TranscriptionProbe:
    build:
      targets:
        TranscriptionProbe: all
  CredentialProbe:
    build:
      targets:
        CredentialProbe: all
  CaptureProbe:
    build:
      targets:
        CaptureProbe: all
