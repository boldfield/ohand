# Reproducible C bindings configuration for ohand-bindings
# Generated bindings are never committed; regenerate during build
# cbindgen >= 0.29 with deterministic output

language = "C"
include_guard = "OHAND_BINDINGS_H"
header = "/* Generated by cbindgen from core/bindings/src/lib.rs. Do not edit. */"
usize_is_size_t = true

[export]
rename = {}
