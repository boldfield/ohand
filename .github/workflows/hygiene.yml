name: Fixture hygiene checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"
  # From gitleaks_8.21.2_checksums.txt published with the v8.21.2 release.
  GITLEAKS_LINUX_X64_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  hygiene:
    name: Secret and privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "/tmp/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"
      - name: Verify scanner version
        run: gitleaks version
      - name: Hygiene tests (scanner tests must not skip)
        env:
          HYGIENE_REQUIRE_GITLEAKS: "1"
        run: make hygiene-test
      - name: Hygiene check on repository
        run: make hygiene-check
