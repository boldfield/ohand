name: Fixture hygiene checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    name: Secret and privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make hygiene-check
