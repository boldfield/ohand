name: Fixture hygiene checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    name: Secret and privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gitleaks
        run: |
          # Install pinned gitleaks version from official releases
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks-linux-x64" -o gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - run: make hygiene-check
