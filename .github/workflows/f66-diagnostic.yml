name: F66 diagnostic (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  iterate:
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - "OhAndTests/ProviderAndPermissionFailureJourneyTests/testDeniedNotificationPermissionFailsSchedulingHonestlyWhileSaveAndProcessingStayIntact"
          - "OhAndTests/ProviderAndPermissionFailureJourneyTests/testDeniedNotificationPermissionFailsSchedulingHonestlyWhileSaveAndProcessingStayIntact#2"
          - "OhAndTests/ExportSettingsViewTests/testAFailedShareAndACompletedShareShowTheirOwnOutcome"
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: brew install mint
      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/.evidence
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > ios/.evidence/simctl-devices.json
          python3 ios/scripts/select_simulator.py --input ios/.evidence/simctl-devices.json --max-runtime "${sdk_version}" >> "$GITHUB_OUTPUT"
      - run: cd ios && ./scripts/generate.sh
      - name: Build
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild build-for-testing \
            -project OhAnd.xcodeproj -scheme OhAndTests -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tail -5
      - name: Iterate (up to 250, stop at first failure)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -uo pipefail
          cd ios
          xcodebuild test-without-building \
            -project OhAnd.xcodeproj -scheme OhAndTests -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived -only-testing:"${TARGET%%#*}" \
            -test-iterations 250 -run-tests-until-failure \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee .evidence/iter.log
          status=${PIPESTATUS[0]}
          echo "=== xcodebuild exit ${status} ==="
          echo "passed iterations: $(grep -cE "Test case .* passed" .evidence/iter.log)"
          echo "failed iterations: $(grep -cE "Test case .* failed" .evidence/iter.log)"
          grep -E "error:" .evidence/iter.log | head -20
          exit ${status}
