          xcrun simctl list -j devices available > ios/.evidence/simctl-devices.json
          python3 ios/scripts/select_simulator.py \
            --input ios/.evidence/simctl-devices.json \
            --max-runtime "${sdk_version}" | tee ios/.evidence/simulator.txt >> "$GITHUB_OUTPUT"
          echo "Selected simulator (SDK ${sdk_version}):"
          cat ios/.evidence/simulator.txt

      - name: Generate Xcode project
        run: cd ios && ./scripts/generate.sh

      - name: Build CaptureProbe UI tests (no simulator booted yet)
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild build-for-testing \
            -project OhAnd.xcodeproj \
            -scheme CaptureProbeUITests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee .evidence/CaptureProbeUITests-build.log

      - name: Build CaptureProbe
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          ./scripts/build-simulator.sh CaptureProbe 2>&1 | tee .evidence/CaptureProbe-build.log

      - name: Build OhAndApp
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          OHAND_DERIVED_DATA_PATH=.derived/OhAndApp OHAND_SIMULATOR_ADHOC_SIGN=1 ./scripts/build-simulator.sh OhAndApp 2>&1 | tee .evidence/OhAndApp-build.log

      - name: Build TranscriptionProbe
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          ./scripts/build-simulator.sh TranscriptionProbe 2>&1 | tee .evidence/TranscriptionProbe-build.log

      - name: Stop the build service before the first boot
        shell: bash
        run: |
          pkill -x XCBBuildService || true
          pkill -x SourceKitService || true
          vm_stat | head -4

      # This job's one cold boot: the device is erased, booted and settled (30 probes in a row) once, and stays booted for the
      # steps below. The compile steps above ran before it.
      - name: Cold boot simulator (single cold boot)
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd ios
          ./scripts/prepare-simulator.sh "${SIMULATOR_UDID}" --erase --label cold-boot-device 2>&1 | tee .evidence/prepare-cold-boot.log

      - name: CaptureProbe handoff UI test and ingress smoke test
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          echo "Capture smoke device: ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}, UDID ${SIMULATOR_UDID})"
          cd ios
          ./scripts/smoke-capture-simulator.sh \
            "${SIMULATOR_UDID}" \
            com.boldfield.ohand.probes.capture \
            .evidence 2>&1 | tee .evidence/capture-smoke.log

      - name: Launch OhAndApp smoke test
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          echo "OhAndApp smoke test: ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}, UDID ${SIMULATOR_UDID})"
          cd ios
          ./scripts/retry-simulator-step.sh "${SIMULATOR_UDID}" .evidence/ohandapp-smoke.log -- ./scripts/smoke-simulator.sh \
            "${SIMULATOR_UDID}" \
            .derived/OhAndApp/Build/Products/Debug-iphonesimulator/OhAnd.app \
            com.boldfield.ohand.app \
            .evidence \
            "ohandapp-launch.png"

      - name: Verify OhAndApp embedded frameworks
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          app_path=.derived/OhAndApp/Build/Products/Debug-iphonesimulator/OhAnd.app
          {
            find "${app_path}/Frameworks" "${app_path}/PlugIns" -maxdepth 2
            for framework in OhAndServices OhAndCoreBridge; do
              test -f "${app_path}/Frameworks/${framework}.framework/${framework}"
            done
            test -d "${app_path}/PlugIns/OhAndCaptureControl.appex"
            test ! -d "${app_path}/PlugIns/OhAndCaptureControl.appex/Frameworks"
            # A production bundle carries no test-host injection (OhAndTests uses OhAnd.app as TEST_HOST).
            test_host_files="$(find "${app_path}" \( -iname 'XC*' -o -iname 'Testing.framework' -o -iname 'libXCTest*' -o -name '*.xctest' \) -print)"
            if [ -n "${test_host_files}" ]; then
              echo "OhAnd.app contains test-host files:" >&2
              echo "${test_host_files}" >&2
              exit 1
            fi
          } 2>&1 | tee .evidence/OhAndApp-bundle.txt

      - name: Launch TranscriptionProbe smoke test
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          echo "TranscriptionProbe smoke test: ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}, UDID ${SIMULATOR_UDID})"
          cd ios
          ./scripts/retry-simulator-step.sh "${SIMULATOR_UDID}" .evidence/transcription-smoke.log -- ./scripts/smoke-simulator.sh \
            "${SIMULATOR_UDID}" \
            .derived/Build/Products/Debug-iphonesimulator/TranscriptionProbe.app \
            com.boldfield.ohand.probes.transcription \
            .evidence \
            "transcriptionprobe-launch.png"

      - name: Delete simulator template
        if: always()
        shell: bash
        run: |
          xcrun simctl shutdown all || true
          if [ -n "${TEMPLATE_UDID:-}" ]; then xcrun simctl delete "${TEMPLATE_UDID}" || true; fi
          echo "=== host-pressure.txt ===" && cat ios/.evidence/host-pressure.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ios-evidence-capture
          path: |
            ios/.evidence
            !ios/.evidence/**/*.xcresult
            !ios/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      # Result bundles never upload (docs/features/ci-artifact-budget.md): a failed job exports its test summary, test list and
      # the failed tests' attachments, under 100 MB.
      - name: Upload evidence (export failure diagnostics)
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          CAP_BYTES: "8000000"
        run: ios/scripts/export-failure-diagnostics.sh ios/.evidence/failure-diagnostics $(find ios/.evidence -name '*.xcresult' -prune)

      - name: Upload evidence (failure diagnostics, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ios-evidence-capture-failure
          path: |
            ios/.evidence/failure-diagnostics
            !ios/.evidence/**/*.xcresult
            !ios/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # One job per width: an iPhone and an iPad are different device types, so each pays its own first boot, and two jobs
  # cost one more concurrent macOS job. Both run on xcode-27 (arm64) with the build service stopped before the first boot.
  walkthrough:
    name: Screenshot walkthrough (${{ matrix.width }} width)
    # macos-26-intel (head cde5ac8, run 40233254176) took 323-563 s to cold boot and failed the readiness settle; arm64 has
    # faster cores and a GPU. The build service is stopped before the first boot so the memory the build held is returned
    # (this job only runs UI tests, which need less than the simulator job). Timing on xcode-27 is in host-pressure.txt.
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: compact
            family: iPhone
          - width: regular
            family: iPad
    env:
      OHAND_HOST_PRESSURE_FILE: ${{ github.workspace }}/ios/.evidence/host-pressure.txt
    steps:
      - uses: actions/checkout@v4

      - name: Stop unneeded host work
        shell: bash
        run: ios/scripts/quiet-host.sh

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Must equal options.xcodeVersion in ios/project.yml (enforced by check_project_config.py).
          xcode-version: '27.2'

      # CI09: the verified XcodeGen release archive, keyed by version and digest; a warm job downloads nothing.
      - name: Restore XcodeGen archive cache
        id: xcodegen-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ohand-xcodegen
          key: xcodegen-2.40.0-7a57affbf81f57aaa3c76c2fa484d0dab940829e980951941aa7e5960dab64e6

      - name: Install XcodeGen
        shell: bash
        run: ios/scripts/install-xcodegen.sh

      # Saved as soon as it is verified, so a cold job that fails later still fills the cache.
      - name: Save XcodeGen archive cache
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ohand-xcodegen
          key: xcodegen-2.40.0-7a57affbf81f57aaa3c76c2fa484d0dab940829e980951941aa7e5960dab64e6

      # A regular-width run needs an iPad; without one that leg selects nothing and its later steps are skipped.
      - name: Select simulator
        id: simulator
        shell: bash
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          mkdir -p ios/.evidence
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > ios/.evidence/simctl-devices.json
          if python3 ios/scripts/select_simulator.py --input ios/.evidence/simctl-devices.json \
              --max-runtime "${sdk_version}" --family "${DEVICE_FAMILY}" > ios/.evidence/simulator.txt; then
            cat ios/.evidence/simulator.txt >> "$GITHUB_OUTPUT"
          fi
          cat ios/.evidence/simulator.txt

      - name: Generate Xcode project
        if: steps.simulator.outputs.udid != ''
        run: cd ios && ./scripts/generate.sh

      # Compile before the simulator is booted: a freshly booted device keeps the runner saturated, and the
      # walkthrough's own xcodebuild would otherwise compile on top of that and starve its UI queries.
      - name: Build walkthrough UI tests (no simulator booted yet)
        if: steps.simulator.outputs.udid != ''
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild build-for-testing \
            -project OhAnd.xcodeproj \
            -scheme OhAndWalkthroughUITests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived/Walkthrough \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee .evidence/walkthrough-build.log

      - name: Stop the build service before the first boot
        shell: bash
        run: |
          pkill -x XCBBuildService || true
          pkill -x SourceKitService || true
          vm_stat | head -4

      - name: Walkthrough at ${{ matrix.width }} width
        if: steps.simulator.outputs.udid != ''
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          WIDTH: ${{ matrix.width }}
        run: |
          set -euo pipefail
          cd ios
          ./scripts/walkthrough-simulator.sh "${SIMULATOR_UDID}" .evidence "${WIDTH}"

      - name: Show host pressure
        if: always()
        shell: bash
        run: cat ios/.evidence/host-pressure.txt || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ios-walkthrough-${{ matrix.width }}
          path: |
            ios/.evidence
            !ios/.evidence/**/*.xcresult
            !ios/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      # Result bundles never upload (docs/features/ci-artifact-budget.md): a failed job exports its test summary, test list and
      # the failed tests' attachments, under 100 MB.
      - name: Upload screenshots (export failure diagnostics)
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          CAP_BYTES: "24000000"
        run: ios/scripts/export-failure-diagnostics.sh ios/.evidence/failure-diagnostics $(find ios/.evidence -name '*.xcresult' -prune)

      - name: Upload screenshots (failure diagnostics, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ios-walkthrough-${{ matrix.width }}-failure
          path: |
            ios/.evidence/failure-diagnostics
            !ios/.evidence/**/*.xcresult
            !ios/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # Accessibility audits at the default and the largest accessibility content size, in two jobs that each run half of the
  # tests (ios/scripts/accessibility-groups.txt) at both sizes, in order, on their own iPhone simulator: the largest size
  # settles from the default size's settled-default.txt, so the sizes cannot be split, the tests can. Any audit issue fails
  # the job; each artifact holds the audit log, the summary and the large-text screenshots.
  accessibility:
    name: accessibility (group ${{ matrix.group }})
    runs-on: xcode-27
    # Generating the project alone took 8 minutes on one hosted runner (run 41720210504), and the two audit runs about 45.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        group: [a, b]
    env:
      OHAND_HOST_PRESSURE_FILE: ${{ github.workspace }}/ios/.evidence/host-pressure.txt
    steps:
      - uses: actions/checkout@v4

      - name: Stop unneeded host work
        shell: bash
        run: ios/scripts/quiet-host.sh

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Must equal options.xcodeVersion in ios/project.yml (enforced by check_project_config.py).
          xcode-version: '27.2'

      # CI09: the verified XcodeGen release archive, keyed by version and digest; a warm job downloads nothing.
      - name: Restore XcodeGen archive cache
        id: xcodegen-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ohand-xcodegen
          key: xcodegen-2.40.0-7a57affbf81f57aaa3c76c2fa484d0dab940829e980951941aa7e5960dab64e6

      - name: Install XcodeGen
        id: xcodegen-install
        shell: bash
        run: ios/scripts/install-xcodegen.sh

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/.evidence
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > ios/.evidence/simctl-devices.json
          # No iPhone simulator fails the job here: this gate never skips its audits (test_accessibility_gate.py).
          python3 ios/scripts/select_simulator.py --input ios/.evidence/simctl-devices.json \
            --max-runtime "${sdk_version}" --family iPhone | tee ios/.evidence/simulator.txt >> "$GITHUB_OUTPUT"
          grep -q '^udid=.' ios/.evidence/simulator.txt
          cat ios/.evidence/simulator.txt

      - name: Generate Xcode project
        run: cd ios && ./scripts/generate.sh

      # Compile before the simulator is booted, as the walkthrough does.
      - name: Build accessibility UI tests (no simulator booted yet)
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild build-for-testing \
            -project OhAnd.xcodeproj \
            -scheme OhAndAccessibilityUITests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived/Accessibility \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee .evidence/accessibility-build.log

      - name: Stop the build service before the first boot
        shell: bash
        run: |
          pkill -x XCBBuildService || true
          pkill -x SourceKitService || true
          vm_stat | head -4

      - name: Accessibility audits
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          AUDIT_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          cd ios
          ./scripts/accessibility-simulator.sh "${SIMULATOR_UDID}" .evidence "${AUDIT_GROUP}"

      # Unconditional steps only up to the audits (test_accessibility_gate.py), so this job saves the archive after them.
      - name: Save XcodeGen archive cache
        if: always() && steps.xcodegen-install.outcome == 'success' && steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ohand-xcodegen
          key: xcodegen-2.40.0-7a57affbf81f57aaa3c76c2fa484d0dab940829e980951941aa7e5960dab64e6

      - name: Show host pressure
        if: always()
        shell: bash
        run: cat ios/.evidence/host-pressure.txt || true

      # The large-text screenshots go up as quality-60 JPEGs, about a fifth of the PNG size (CI artifact budget). The
      # second screenshot of a stop the audit scrolled (`*-audited-*`) goes up at half width and quality 40. The default-size
      # screenshots are compressed the same way but upload only with the failure diagnostics (below).
      - name: Compress large-text screenshots
        if: always()
        shell: bash
        run: |
          for png in ios/.evidence/accessibility/xxxl-*.png ios/.evidence/accessibility/default-*.png; do
            [ -e "${png}" ] || continue
            case "${png}" in
              *-audited-*) sips --resampleWidth 603 -s format jpeg -s formatOptions 40 "${png}" --out "${png%.png}.jpg" >/dev/null && rm "${png}" || true ;;
              *) sips -s format jpeg -s formatOptions 60 "${png}" --out "${png%.png}.jpg" >/dev/null && rm "${png}" || true ;;
            esac
          done
          du -sh ios/.evidence/accessibility || true

      # Routine evidence only (CI artifact budget): the audit logs, the summary and the large-text screenshots.
      - name: Upload audit log and large-text screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-accessibility-${{ matrix.group }}
          path: |
            ios/.evidence/accessibility/audit-*.log
            ios/.evidence/accessibility/settled-*.txt
            ios/.evidence/accessibility/xxxl-*.jpg
            ios/.evidence/accessibility/xxxl-*.png
            ios/.evidence/accessibility-summary.txt
            ios/.evidence/accessibility-*.log
            ios/.evidence/accessibility-*.attempt-1
            ios/.evidence/simulator.txt
            ios/.evidence/simulator-recoveries.txt
            !ios/.evidence/**/*.xcresult
            !ios/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      # Result bundles never upload (docs/features/ci-artifact-budget.md): a failed job exports its test summary, test list and
      # the failed tests' attachments, under 100 MB.
      - name: Upload evidence (export failure diagnostics)
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          CAP_BYTES: "24000000"
        run: ios/scripts/export-failure-diagnostics.sh ios/.evidence/failure-diagnostics $(find ios/.evidence -name '*.xcresult' -prune)

      - name: Upload evidence (failure diagnostics, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ios-accessibility-${{ matrix.group }}-failure
          path: |
            ios/.evidence/failure-diagnostics
            ios/.evidence/accessibility/default-*.jpg
            !ios/.evidence/**/*.xcresult
            !ios/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  tauri-probe:
    name: Tauri 2 iOS probe build and round-trip test
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: probes/tauri
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Must equal options.xcodeVersion in ios/project.yml (enforced by check_project_config.py).
          xcode-version: '27.2'

      - name: Record toolchain versions
        run: |
          set -euo pipefail
          mkdir -p .evidence
          {
            echo "=== Runner ===" && sw_vers
            echo "=== Xcode ===" && xcodebuild -version
            echo "=== Simulator SDK ===" && xcrun --sdk iphonesimulator --show-sdk-version
            echo "=== Node ===" && node --version && npm --version
          } 2>&1 | tee .evidence/toolchain.txt

      - name: Install pinned Rust toolchain and iOS simulator target
        run: |
          set -euo pipefail
          # rustup reads the repository rust-toolchain.toml and installs the pinned channel.
          rustup show active-toolchain
          rustup target add aarch64-apple-ios-sim
          { rustc --version && cargo --version; } 2>&1 | tee -a .evidence/toolchain.txt

      - name: Install pinned Tauri CLI from package-lock.json
        run: |
          set -euo pipefail
          npm ci
          npx tauri --version 2>&1 | tee -a .evidence/toolchain.txt

      - name: Check JavaScript boundary and lockfile coherence
        run: |
          set -euo pipefail
          # No provider credentials, remote scripts or network calls in the webview assets.
          if grep -rEin 'api[_-]?key|secret|bearer|authorization|https?://|fetch\(|XMLHttpRequest' dist; then
            echo "FAILURE: webview assets reference credentials or remote endpoints"
            exit 1
          fi
          (cd src-tauri && cargo metadata --locked --format-version 1 > /dev/null)

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > /tmp/simctl-devices.json
          python3 ../../ios/scripts/select_simulator.py \
            --input /tmp/simctl-devices.json \
            --max-runtime "${sdk_version}" | tee .evidence/simulator.txt >> "$GITHUB_OUTPUT"
          cat .evidence/simulator.txt

      - name: Initialize generated Tauri iOS project
        run: |
          set -euo pipefail
          npx tauri ios init --ci 2>&1 | tee .evidence/ios-init.log

      - name: Build Tauri probe for iOS simulator
        run: |
          set -euo pipefail
          npx tauri ios build --ci --debug --target aarch64-sim 2>&1 | tee .evidence/build.log

      - name: Install, launch and assert echo round-trip
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          bundle_id="com.boldfield.ohand.tauri-probe"
          echo "Device: ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}, UDID ${SIMULATOR_UDID})" | tee .evidence/roundtrip.log

          find src-tauri/gen/apple -name '*.app' -type d | tee .evidence/app-bundles.txt
          app_path="$(grep -m1 '\.app$' .evidence/app-bundles.txt || true)"
          if [ -z "${app_path}" ]; then
            echo "FAILURE: no .app bundle produced by the build" | tee -a .evidence/roundtrip.log
            exit 1
          fi
          echo "App bundle: ${app_path}" | tee -a .evidence/roundtrip.log
          plutil -p "${app_path}/Info.plist" > .evidence/app-Info.plist.txt

          # A device fault before any assertion ran (no booted device, no display port) is retried once by
          # retry-simulator-step.sh, which re-prepares the device; the install, launch and assertions run again.
          roundtrip_check() {
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b 2>&1 | tee -a .evidence/roundtrip.log
          xcrun simctl install "${SIMULATOR_UDID}" "${app_path}" 2>&1 | tee -a .evidence/roundtrip.log
          launch_output="$(xcrun simctl launch --stdout="$PWD/.evidence/app-stdout.log" --stderr="$PWD/.evidence/app-stderr.log" "${SIMULATOR_UDID}" "${bundle_id}")"
          echo "${launch_output}" | tee -a .evidence/roundtrip.log
          app_pid="${launch_output##*: }"

          data_dir="$(xcrun simctl get_app_container "${SIMULATOR_UDID}" "${bundle_id}" data)"
          record_file="$(find "${data_dir}" -name roundtrip.json | head -1 || true)"
          for _ in $(seq 1 60); do
            [ -n "${record_file}" ] && break
            sleep 1
            record_file="$(find "${data_dir}" -name roundtrip.json | head -1 || true)"
          done
          if [ -z "${record_file}" ]; then
            echo "FAILURE: webview never reported a rendered round-trip result" | tee -a .evidence/roundtrip.log
            find "${data_dir}" | tee -a .evidence/roundtrip.log
            exit 1
          fi
          cp "${record_file}" .evidence/roundtrip.json
          cat .evidence/roundtrip.json | tee -a .evidence/roundtrip.log

          python3 - <<'PY'
          import json, sys
          record = json.load(open(".evidence/roundtrip.json"))
          expected = {"status": "Success", "rendered_result": "Echo from Rust: Hello from Tauri"}
          if record != expected:
              sys.exit(f"FAILURE: round-trip record {record!r} != {expected!r}")
          print("ASSERTED: webview rendered the value returned by the Rust command")
          PY

          kill -0 "${app_pid}" || { echo "FAILURE: app is not running after round-trip" | tee -a .evidence/roundtrip.log; exit 1; }
          xcrun simctl io "${SIMULATOR_UDID}" screenshot .evidence/screenshot.png
          test -s .evidence/screenshot.png
          echo "Tauri probe passed" | tee -a .evidence/roundtrip.log
          }
          export -f roundtrip_check
          export app_path bundle_id
          ../../ios/scripts/retry-simulator-step.sh "${SIMULATOR_UDID}" .evidence/roundtrip-run.log -- bash -c 'set -euo pipefail; roundtrip_check'

      # CI09: the verified XcodeGen release archive, keyed by version and digest; a warm job downloads nothing.
      - name: Restore XcodeGen archive cache
        id: xcodegen-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ohand-xcodegen
          key: xcodegen-2.40.0-7a57affbf81f57aaa3c76c2fa484d0dab940829e980951941aa7e5960dab64e6

      - name: Install XcodeGen
        shell: bash
        working-directory: ${{ github.workspace }}
        run: ios/scripts/install-xcodegen.sh

      # Saved as soon as it is verified, so a cold job that fails later still fills the cache.
      - name: Save XcodeGen archive cache
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ohand-xcodegen
          key: xcodegen-2.40.0-7a57affbf81f57aaa3c76c2fa484d0dab940829e980951941aa7e5960dab64e6

      # Real handoff between two installed apps: CaptureProbe (native entry) opens this Tauri shell by URL.
      - name: Native-to-Tauri handoff UI tests (cold, warm, hostile routes, largest text)
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          evidence_dir="$PWD/.evidence"
          tauri_bundle_id="com.boldfield.ohand.tauri-probe"
          capture_bundle_id="com.boldfield.ohand.probes.capture"
          log_file="${evidence_dir}/handoff-uitests.log"

          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
          xcrun simctl terminate "${SIMULATOR_UDID}" "${tauri_bundle_id}" 2>/dev/null || true
          xcrun simctl uninstall "${SIMULATOR_UDID}" "${capture_bundle_id}" 2>/dev/null || true
          tauri_data_dir="$(xcrun simctl get_app_container "${SIMULATOR_UDID}" "${tauri_bundle_id}" data)"
          find "${tauri_data_dir}" -type d -name handoffs -prune -exec rm -rf {} +

          # A failed UI test must still leave the container files behind as evidence, so the status is kept and checked last.
          uitest_status=0
          (
            cd ../../ios
            ./scripts/generate.sh
            rm -rf "${evidence_dir}"/ManagementHandoffUITests*.xcresult
            # A launch or device fault before any assertion ran is retried once; retry-simulator-step.sh writes ${log_file}.
            ./scripts/retry-simulator-step.sh "${SIMULATOR_UDID}" "${log_file}" -- xcodebuild test \
              -project OhAnd.xcodeproj \
              -scheme ManagementHandoffUITests \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
              -derivedDataPath .derived \
              -resultBundlePath "${evidence_dir}/ManagementHandoffUITests%ATTEMPT_SUFFIX%.xcresult" \
              CODE_SIGNING_ALLOWED=NO
          ) 2>&1 || uitest_status=$?

          grep -o 'HANDOFF-PHASE .*' "${log_file}" | awk '!seen[$2]++' | tee "${evidence_dir}/handoff-phases.txt" || true

          tauri_data_dir="$(xcrun simctl get_app_container "${SIMULATOR_UDID}" "${tauri_bundle_id}" data)"
          capture_data_dir="$(xcrun simctl get_app_container "${SIMULATOR_UDID}" "${capture_bundle_id}" data)"
          capture_root="${capture_data_dir}/Library/Application Support/CaptureProbe"
          find "${tauri_data_dir}" -type f | tee "${evidence_dir}/shell-container-files.txt" || true
          handoff_dir="$(find "${tauri_data_dir}" -type d -name handoffs | head -1)"
          if [ -n "${handoff_dir}" ]; then cp -R "${handoff_dir}" "${evidence_dir}/shell-handoffs"; fi
          cp -R "${tauri_data_dir}/Library/Application Support" "${evidence_dir}/shell-app-support" || true
          if [ -d "${capture_root}" ]; then cp -R "${capture_root}" "${evidence_dir}/capture-root"; fi

          if [ "${uitest_status}" -ne 0 ]; then
            echo "FAILURE: ManagementHandoffUITests exited with ${uitest_status}"
            exit "${uitest_status}"
          fi
          grep -F '** TEST SUCCEEDED **' "${log_file}"
          test -n "${handoff_dir}" || { echo "FAILURE: the shell persisted no handoffs directory"; exit 1; }

          python3 ../../ios/scripts/verify_handoff_evidence.py \
            --handoff-dir "${handoff_dir}" \
            --capture-root "${capture_root}" \
            --log "${log_file}" \
            --shell-trace "$(dirname "${handoff_dir}")/run-events.log" 2>&1 | tee "${evidence_dir}/handoff-verification.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tauri-probe-evidence
          path: |
            probes/tauri/.evidence
            !probes/tauri/.evidence/**/*.xcresult
            !probes/tauri/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      # Result bundles never upload (docs/features/ci-artifact-budget.md): a failed job exports its test summary, test list and
      # the failed tests' attachments, under 100 MB.
      - name: Upload evidence (export failure diagnostics)
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          CAP_BYTES: "24000000"
        run: ../../ios/scripts/export-failure-diagnostics.sh .evidence/failure-diagnostics $(find .evidence -name '*.xcresult' -prune)

      - name: Upload evidence (failure diagnostics, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tauri-probe-evidence-failure
          path: |
            probes/tauri/.evidence/failure-diagnostics
            !probes/tauri/.evidence/**/*.xcresult
            !probes/tauri/.evidence/**/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
