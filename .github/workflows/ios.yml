name: iOS simulator checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-build:
    name: Generate project and build simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install mint
        run: brew install mint
      - name: Generate Xcode project
        run: cd ios && ./scripts/generate.sh
      - name: Capture toolchain versions
        run: |
          echo "=== Xcode version ===" && xcodebuild -version
          echo "=== Swift version ===" && swift --version
          echo "=== Simulator SDK version ===" && xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build BridgeProbe for simulator
        run: cd ios && ./scripts/build-simulator.sh BridgeProbe
      - name: Verify build artifact exists
        run: |
          if [ -d "ios/.derived/Build/Products/Debug-iphonesimulator/BridgeProbe.app" ]; then
            echo "BridgeProbe simulator build successful"
            ls -lh ios/.derived/Build/Products/Debug-iphonesimulator/BridgeProbe.app
          else
            echo "ERROR: BridgeProbe.app not found"
            exit 1
          fi

  test:
    name: Run unit tests with simulator launch
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install mint
        run: brew install mint
      - name: Generate Xcode project
        run: cd ios && ./scripts/generate.sh
      - name: List available simulators
        run: |
          echo "=== Available simulators ===" && xcrun simctl list devices iOS available
      - name: Determine simulator destination
        id: simulator
        run: |
          # Parse available simulators, iterate through iOS runtimes, and select first available iPhone
          python3 << 'PYTHON_EOF'
          import json
          import sys

          data = json.load(sys.stdin)
          devices = data.get('devices', {})

          # Find iOS runtime keys and sort by version (descending)
          ios_runtimes = sorted(
              [k for k in devices.keys() if k.startswith('com.apple.CoreSimulator.SimRuntime.iOS-')],
              reverse=True
          )

          if not ios_runtimes:
              print("ERROR: No iOS simulators found", file=sys.stderr)
              sys.exit(1)

          # Find first available iPhone simulator
          selected = None
          selected_runtime_key = None
          for runtime_key in ios_runtimes:
              devices_in_runtime = devices.get(runtime_key, [])
              for device in devices_in_runtime:
                  if device.get('isAvailable', False) and device.get('name', '').startswith('iPhone'):
                      selected = device
                      selected_runtime_key = runtime_key
                      break
              if selected:
                  break

          if not selected:
              print("ERROR: No available iPhone simulator found", file=sys.stderr)
              sys.exit(1)

          # Extract runtime version from the key
          runtime_version = selected_runtime_key.replace('com.apple.CoreSimulator.SimRuntime.iOS-', '')

          device_udid = selected.get('udid', '')
          device_name = selected.get('name', '')

          if not device_udid:
              print("ERROR: Failed to extract simulator UDID", file=sys.stderr)
              sys.exit(1)

          # Write to GitHub output and capture variables
          print(f"udid={device_udid}")
          print(f"name={device_name}")
          print(f"runtime={runtime_version}")
          PYTHON_EOF > /tmp/sim_output.txt

          # Parse output file
          while IFS='=' read -r key value; do
            echo "$key=$value" >> $GITHUB_OUTPUT
          done < /tmp/sim_output.txt

          # Extract values for logging
          DEVICE_UDID=$(grep "^udid=" /tmp/sim_output.txt | cut -d= -f2)
          DEVICE_NAME=$(grep "^name=" /tmp/sim_output.txt | cut -d= -f2)
          DEVICE_RUNTIME=$(grep "^runtime=" /tmp/sim_output.txt | cut -d= -f2)
          echo "Selected simulator: $DEVICE_NAME (UDID: $DEVICE_UDID, Runtime: $DEVICE_RUNTIME)"
      - name: Build BridgeProbe for test
        shell: bash
        run: |
          set -o pipefail
          cd ios
          ./scripts/build-simulator.sh BridgeProbe
      - name: Run OhAndTests
        shell: bash
        run: |
          set -o pipefail
          cd ios
          DEVICE_UDID="${{ steps.simulator.outputs.udid }}"
          DEVICE_NAME="${{ steps.simulator.outputs.name }}"

          echo "=== Simulator and Runtime Info ==="
          echo "Device: $DEVICE_NAME (UDID: $DEVICE_UDID)"

          xcodebuild test \
            -project OhAnd.xcodeproj \
            -scheme OhAndTests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -derivedDataPath .derived \
            -resultBundlePath .derived/test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-output.log
      - name: Smoke test - boot simulator and launch app
        shell: bash
        run: |
          set -o pipefail
          cd ios
          DEVICE_UDID="${{ steps.simulator.outputs.udid }}"
          DEVICE_NAME="${{ steps.simulator.outputs.name }}"
          DEVICE_RUNTIME="${{ steps.simulator.outputs.runtime }}"

          echo "=== Device Information ===" && \
          echo "Device Name: $DEVICE_NAME" && \
          echo "Device UDID: $DEVICE_UDID" && \
          echo "Runtime: $DEVICE_RUNTIME"

          # Boot simulator if not already running
          echo "=== Booting simulator ===" && xcrun simctl boot "$DEVICE_UDID" || true

          # Wait deterministically for simulator to boot
          echo "=== Waiting for simulator to boot ===" && \
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          # Install app
          echo "=== Installing BridgeProbe ===" && \
          xcrun simctl install "$DEVICE_UDID" ".derived/Build/Products/Debug-iphonesimulator/BridgeProbe.app" || {
            echo "ERROR: Failed to install BridgeProbe"
            exit 1
          }

          # Launch app with correct bundle ID from project.yml
          echo "=== Launching BridgeProbe ===" && \
          xcrun simctl launch "$DEVICE_UDID" "com.boldfield.ohand.probes.bridge" || {
            echo "ERROR: Failed to launch BridgeProbe"
            exit 1
          }

          echo "=== Smoke test completed successfully ===" && \
          xcrun simctl list devices iOS available | grep "$DEVICE_NAME"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: |
            ios/test-output.log
            ios/.derived/test-results.xcresult
          retention-days: 7
