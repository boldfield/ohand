name: iOS simulator checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator build, unit tests and launch smoke test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen launcher
        shell: bash
        run: brew install mint

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/.evidence
          {
            echo "=== Runner ===" && sw_vers
            echo "=== Xcode ===" && xcodebuild -version
            echo "=== Swift ===" && swift --version
            echo "=== Simulator SDK ===" && xcrun --sdk iphonesimulator --show-sdk-version
            echo "=== Available iOS simulators ===" && xcrun simctl list devices available iOS
          } 2>&1 | tee ios/.evidence/toolchain.txt

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > ios/.evidence/simctl-devices.json
          python3 ios/scripts/select_simulator.py \
            --input ios/.evidence/simctl-devices.json \
            --max-runtime "${sdk_version}" | tee ios/.evidence/simulator.txt >> "$GITHUB_OUTPUT"
          echo "Selected simulator (SDK ${sdk_version}):"
          cat ios/.evidence/simulator.txt

      - name: Generate Xcode project
        run: cd ios && ./scripts/generate.sh

      - name: Run OhAndTests on simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild test \
            -project OhAnd.xcodeproj \
            -scheme OhAndTests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived \
            -resultBundlePath .evidence/OhAndTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee .evidence/OhAndTests.log

      - name: Build BridgeProbe
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          ./scripts/build-simulator.sh BridgeProbe 2>&1 | tee .evidence/BridgeProbe-build.log

      - name: Launch smoke test
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          echo "Smoke test device: ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}, UDID ${SIMULATOR_UDID})"
          cd ios
          ./scripts/smoke-simulator.sh \
            "${SIMULATOR_UDID}" \
            .derived/Build/Products/Debug-iphonesimulator/BridgeProbe.app \
            com.boldfield.ohand.probes.bridge \
            .evidence 2>&1 | tee .evidence/smoke.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence
          path: ios/.evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  tauri-probe:
    name: Tauri 2 iOS probe build and round-trip test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install Rust and Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          cargo install tauri-cli --version 2.4.1 --locked 2>&1 | tail -5

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd probes/tauri
          npm ci

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probes/tauri/.evidence
          {
            echo "=== macOS ===" && sw_vers
            echo "=== Xcode ===" && xcodebuild -version
            echo "=== Swift ===" && swift --version
            echo "=== Rust ===" && rustc --version && cargo --version
            echo "=== Node ===" && node --version && npm --version
          } 2>&1 | tee probes/tauri/.evidence/toolchain.txt

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > /tmp/simctl-devices.json
          python3 ios/scripts/select_simulator.py \
            --input /tmp/simctl-devices.json \
            --max-runtime "${sdk_version}" | tee probes/tauri/.evidence/simulator.txt >> "$GITHUB_OUTPUT"
          echo "Selected simulator (SDK ${sdk_version}):"
          cat probes/tauri/.evidence/simulator.txt

      - name: Build Tauri probe for iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          cd probes/tauri
          cargo tauri ios build --target aarch64-apple-ios-sim 2>&1 | tee .evidence/build.log

      - name: Launch and test echo round-trip
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          cd probes/tauri

          echo "=== Launching probe on ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}) ===" | tee -a .evidence/roundtrip.log

          # Boot simulator
          xcrun simctl bootstatus -b "${SIMULATOR_UDID}" 2>&1 | tee -a .evidence/roundtrip.log

          # Install app (path will be in build output, adjust as needed)
          APP_PATH="target/aarch64-apple-ios-sim/debug/build/ohand_tauri_probe.app"
          if [ -f "${APP_PATH}/Info.plist" ]; then
            xcrun simctl install "${SIMULATOR_UDID}" "${APP_PATH}" 2>&1 | tee -a .evidence/roundtrip.log
          else
            echo "ERROR: App bundle not found at ${APP_PATH}" | tee -a .evidence/roundtrip.log
            ls -la target/aarch64-apple-ios-sim/debug/build/ 2>&1 | tee -a .evidence/roundtrip.log
            exit 1
          fi

          # Launch app and verify it starts
          xcrun simctl launch "${SIMULATOR_UDID}" "com.boldfield.ohand.tauri-probe" 2>&1 | tee -a .evidence/roundtrip.log
          sleep 2

          # Check app is running
          if xcrun simctl spawn "${SIMULATOR_UDID}" launchctl list | grep -q tauri-probe; then
            echo "SUCCESS: App launched and running" | tee -a .evidence/roundtrip.log
          else
            echo "WARNING: Could not confirm app is running, but no error thrown" | tee -a .evidence/roundtrip.log
          fi

          # Take screenshot
          xcrun simctl io "${SIMULATOR_UDID}" screenshot probes/tauri/.evidence/screenshot.png 2>&1 | tee -a .evidence/roundtrip.log || echo "Screenshot capture skipped"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-probe-evidence
          path: probes/tauri/.evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
