name: iOS simulator checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Simulator build, unit tests and launch smoke test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen launcher
        shell: bash
        run: brew install mint

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/.evidence
          {
            echo "=== Runner ===" && sw_vers
            echo "=== Xcode ===" && xcodebuild -version
            echo "=== Swift ===" && swift --version
            echo "=== Simulator SDK ===" && xcrun --sdk iphonesimulator --show-sdk-version
            echo "=== Available iOS simulators ===" && xcrun simctl list devices available iOS
          } 2>&1 | tee ios/.evidence/toolchain.txt

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > ios/.evidence/simctl-devices.json
          python3 ios/scripts/select_simulator.py \
            --input ios/.evidence/simctl-devices.json \
            --max-runtime "${sdk_version}" | tee ios/.evidence/simulator.txt >> "$GITHUB_OUTPUT"
          echo "Selected simulator (SDK ${sdk_version}):"
          cat ios/.evidence/simulator.txt

      - name: Generate Xcode project
        run: cd ios && ./scripts/generate.sh

      - name: Run OhAndTests on simulator
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          cd ios
          xcodebuild test \
            -project OhAnd.xcodeproj \
            -scheme OhAndTests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived \
            -resultBundlePath .evidence/OhAndTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee .evidence/OhAndTests.log

      - name: Build BridgeProbe
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          ./scripts/build-simulator.sh BridgeProbe 2>&1 | tee .evidence/BridgeProbe-build.log

      - name: Launch smoke test
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          echo "Smoke test device: ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}, UDID ${SIMULATOR_UDID})"
          cd ios
          ./scripts/smoke-simulator.sh \
            "${SIMULATOR_UDID}" \
            .derived/Build/Products/Debug-iphonesimulator/BridgeProbe.app \
            com.boldfield.ohand.probes.bridge \
            .evidence 2>&1 | tee .evidence/smoke.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence
          path: ios/.evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  tauri-probe:
    name: Tauri 2 iOS probe build and round-trip test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install Rust and Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          cargo install tauri-cli --version 2.4.1 --locked 2>&1 | tail -5

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd probes/tauri
          npm ci

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probes/tauri/.evidence
          {
            echo "=== macOS ===" && sw_vers
            echo "=== Xcode ===" && xcodebuild -version
            echo "=== Swift ===" && swift --version
            echo "=== Rust ===" && rustc --version && cargo --version
            echo "=== Node ===" && node --version && npm --version
          } 2>&1 | tee probes/tauri/.evidence/toolchain.txt

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list -j devices available > /tmp/simctl-devices.json
          python3 ios/scripts/select_simulator.py \
            --input /tmp/simctl-devices.json \
            --max-runtime "${sdk_version}" | tee probes/tauri/.evidence/simulator.txt >> "$GITHUB_OUTPUT"
          echo "Selected simulator (SDK ${sdk_version}):"
          cat probes/tauri/.evidence/simulator.txt

      - name: Initialize Tauri iOS project
        shell: bash
        run: |
          set -euo pipefail
          cd probes/tauri/src-tauri
          cargo tauri ios init 2>&1 | tee ../.evidence/ios-init.log

      - name: Build Tauri probe for iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          cd probes/tauri
          cargo tauri ios build --target aarch64-sim 2>&1 | tee .evidence/build.log

      - name: Launch and test echo round-trip
        shell: bash
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          set -euo pipefail
          cd probes/tauri

          echo "=== Launching probe on ${SIMULATOR_NAME} (iOS ${SIMULATOR_RUNTIME}) ===" | tee -a .evidence/roundtrip.log

          # Boot simulator
          xcrun simctl bootstatus -b "${SIMULATOR_UDID}" 2>&1 | tee -a .evidence/roundtrip.log

          # Find the app bundle - it should be in src-tauri/target/aarch64-sim/debug/
          APP_PATH=$(find . -path "*target/aarch64-sim/debug*" -name "ohand_tauri_probe.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App bundle not found" | tee -a .evidence/roundtrip.log
            find target -name "*.app" 2>/dev/null | tee -a .evidence/roundtrip.log || true
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH" | tee -a .evidence/roundtrip.log

          # Install app
          xcrun simctl install "${SIMULATOR_UDID}" "$APP_PATH" 2>&1 | tee -a .evidence/roundtrip.log

          # Start capturing logs in background
          xcrun simctl spawn "${SIMULATOR_UDID}" log stream --predicate "process == 'ohand_tauri_probe'" --level debug > .evidence/app.log 2>&1 &
          LOG_PID=$!
          sleep 1

          # Launch app
          echo "=== Launching application ===" | tee -a .evidence/roundtrip.log
          xcrun simctl launch "${SIMULATOR_UDID}" "com.boldfield.ohand.tauri-probe" 2>&1 | tee -a .evidence/roundtrip.log

          # Wait for app to run the automatic echo test
          sleep 5

          # Take screenshot to capture the result
          echo "=== Capturing screenshot ===" | tee -a .evidence/roundtrip.log
          xcrun simctl io "${SIMULATOR_UDID}" screenshot .evidence/screenshot.png 2>&1 || true

          # Kill the log stream
          kill $LOG_PID 2>/dev/null || true
          sleep 1

          # Verify the app is still running
          if ! xcrun simctl spawn "${SIMULATOR_UDID}" launchctl list 2>&1 | grep -q "com.boldfield.ohand.tauri-probe"; then
            echo "FAILURE: App not running after launch" | tee -a .evidence/roundtrip.log
            exit 1
          fi

          echo "App is running" | tee -a .evidence/roundtrip.log

          # Verify echo command was called by checking logs
          if grep -q "Echo command called" .evidence/app.log; then
            echo "SUCCESS: Echo command was called" | tee -a .evidence/roundtrip.log
          else
            echo "WARNING: Echo command output not found in logs" | tee -a .evidence/roundtrip.log
            echo "=== App log contents ===" | tee -a .evidence/roundtrip.log
            cat .evidence/app.log | tee -a .evidence/roundtrip.log
            exit 1
          fi

          echo "=== Simulator test complete ===" | tee -a .evidence/roundtrip.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-probe-evidence
          path: probes/tauri/.evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
